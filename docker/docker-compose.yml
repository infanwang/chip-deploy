version: "3.9"

services:
  # ── 数字流程：Yosys + OpenROAD + Magic + Netgen + KLayout ──
  openlane:
    build: ./openlane
    image: chip-deploy/openlane:2024.10
    container_name: chip-openlane
    hostname: openlane
    volumes:
      - ${HOME}/chip-design/shared:/workspace
      - ${HOME}/chip-design/pdk:/pdk:ro
      - ${HOME}/chip-design/runs:/runs
    environment:
      - PDK_ROOT=/pdk
      - PDK=sky130A
      - DISPLAY=${DISPLAY}
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "yosys", "-V"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12G
        reservations:
          memory: 4G

  # ── 验证流程：Verilator + Icarus + SBY + GTKWave ──
  verif:
    build: ./verif
    image: chip-deploy/verif:2024.10
    container_name: chip-verif
    hostname: verif
    volumes:
      - ${HOME}/chip-design/shared:/workspace
      - ${HOME}/chip-design/pdk:/pdk:ro
      - ${HOME}/chip-design/runs:/runs
    environment:
      - PDK_ROOT=/pdk
      - DISPLAY=${DISPLAY}
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "verilator", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 模拟/混合信号：Xschem + Ngspice + Magic (AMS) ──
  analog:
    build: ./analog
    image: chip-deploy/analog:2024.10
    container_name: chip-analog
    hostname: analog
    volumes:
      - ${HOME}/chip-design/shared:/workspace
      - ${HOME}/chip-design/pdk:/pdk:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - PDK_ROOT=/pdk
      - DISPLAY=${DISPLAY}
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ── 可选：RISC-V SDK 验证环境 ──
  riscv-sdk:
    build: ./riscv-sdk
    image: chip-deploy/riscv-sdk:2024.10
    container_name: chip-riscv-sdk
    hostname: riscv-sdk
    volumes:
      - ${HOME}/chip-design/shared:/workspace
      - ${HOME}/chip-design/runs:/runs
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    profiles:
      - sdk
